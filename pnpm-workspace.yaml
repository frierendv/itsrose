packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/**'

catalog:
  '@types/node': 24.12.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  chalk: ^4.1.2
  next: ^16.3.0
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ^5.9.3
  zod: ^4.4.3

overrides:
  'test-exclude': '^8.0.0'
  'glob': '^13.0.6'

patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch

auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true

nodeLinker: isolated
syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true
