packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/**'
  - 'packages/auth/*'

catalog:
  '@types/node': 26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  axios: ^1.21.0
  better-auth: ^1.7.18
  chalk: ^4.1.2
  next: ^16.4.5
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^5.9.3
  zod: ^4.6.7

overrides:
  'test-exclude': '^8.0.0'
  'glob': ^14.0.4

  undici@>=7.0.0 <7.28.0: ^7.29.0
  minimatch: ^11.0.1
  follow-redirects: ^1.16.2
  seroval: ^1.6.10
  qs: ^6.16.1
  fast-uri: ^2.4.8
  ip-address: ^10.7.4
  markdown-it: ^15.0.3
  body-parser: ^2.4.0
  proxy-addr: ^2.0.8
  handlebars: ^4.7.10
  hono: ^4.13.11
  '@hono/node-server': ^2.1.3
  '@modelcontextprotocol/sdk': ^1.32.2

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  '@swc/core': true
  '@parcel/watcher': true

nodeLinker: isolated
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
