packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/**'
  - 'packages/auth/*'

catalog:
  '@types/node': 26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  axios: ^1.21.0
  better-auth: ^1.7.18
  chalk: ^4.1.2
  next: ^16.4.5
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^5.9.3
  zod: ^4.6.7

overrides:
  'test-exclude': '^8.0.0'
  'glob': ^14.0.4

  undici@>=7.0.0 <7.28.0: ^7.29.0

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  '@swc/core': true
  '@parcel/watcher': true

nodeLinker: isolated
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
