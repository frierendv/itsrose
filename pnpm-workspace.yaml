packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/**'

catalog:
  '@types/node': 24.12.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  chalk: ^4.1.2
  next: ^16.3.4
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^5.9.3
  zod: ^4.6.1

overrides:
  'test-exclude': '^8.0.0'
  'glob': '^13.0.6'

  # audit; overrides
  hono@<4.13.5: ^4.13.5
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.15.4
  svgo@>=4.0.0 <4.1.0: ^4.1.0

patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch

auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  '@swc/core': true
  '@parcel/watcher': true

nodeLinker: isolated
syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true
