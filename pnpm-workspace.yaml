packages:
  - "apps/*"
  - "packages/*"
  - "packages/**"
  - "packages/auth/*"

catalog:
  "@types/node": 26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  axios: ^1.21.1
  better-auth: ^1.7.19
  chalk: ^4.1.2
  next: ^16.4.6
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^5.9.3
  zod: ^4.6.7

overrides:
  "test-exclude": "^8.0.0"
  "glob": ^14.0.4

  undici@>=7.0.0 <7.28.0: ^7.29.0
  minimatch: ^11.0.5
  follow-redirects: ^1.16.3
  seroval: ^1.8.0
  qs: ^6.17.1
  fast-uri: ^4.2.3
  ip-address: ^10.7.6
  markdown-it: ^15.0.3
  body-parser: ^2.4.0
  proxy-addr: ^2.0.8
  handlebars: ^4.7.10
  hono: ^4.13.17
  "@hono/node-server": ^2.1.6
  "@modelcontextprotocol/sdk": ^1.32.2

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  "@swc/core": true
  "@parcel/watcher": true

nodeLinker: isolated
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
