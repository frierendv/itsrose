packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/**'

catalog:
  '@types/node': 24.12.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  chalk: ^4.1.2
  next: ^16.3.5
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^5.9.3
  zod: ^4.6.2

overrides:
  'test-exclude': '^8.0.0'
  'glob': '^13.0.6'

  undici@>=7.0.0 <7.28.0: ^7.29.0

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  '@swc/core': true
  '@parcel/watcher': true

nodeLinker: isolated
syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true
