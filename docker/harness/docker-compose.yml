services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DSH_IMAGE:-harness:dev}
    container_name: harness
    hostname: ${CONTAINER_HOSTNAME:-dsh-harness}
    restart: unless-stopped
    environment:
      # Public reverse proxy port
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      # Expected external hostname for DSH web server
      - DSH_TRUSTED_HOST=${DSH_TRUSTED_HOST:-}
    volumes:
      - ${DSH_WORKSPACE:-./workspace}:/workspace
      - dsh-data:/home/node/.dsh

    # DSH's confinement backends need user namespaces, which the default Docker
    # seccomp profile and masked-path set can block. The container is the
    # boundary here, so these stay; they are only removable if DSH selects the
    # Landlock backend (Linux >= 5.13), which needs neither.
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined

    labels:
      # exposedbydefault=false in docker-compose.net.yml makes this mandatory.
      - traefik.enable=true
      # Required when the proxy may be attached to more than one network.
      - traefik.docker.network=itsrose_dev_center
      - traefik.http.routers.harness.entrypoints=web
      # Public hostname the tunnel forwards to this router. Override with
      # DSH_TRUSTED_HOST; it must match the public hostname configured on the
      # Cloudflare tunnel (dashboard -> tunnel -> public hostnames).
      - "traefik.http.routers.harness.rule=Host(`${DSH_TRUSTED_HOST}`)"
      - "traefik.http.services.harness.loadbalancer.server.port=${GATEWAY_PORT:-8080}"
    networks:
      - itsrose_dev_center

volumes:
  dsh-data:
    name: dsh-data

networks:
  # Created by ../docker-compose.net.yml, hence external.
  itsrose_dev_center:
    name: itsrose_dev_center
    external: true
