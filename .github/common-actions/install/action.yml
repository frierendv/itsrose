name: 'Install'
description: 'Setup Node.js and runs install'

runs:
  using: composite
  steps:
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        cache: 'npm'
        check-latest: true
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      run: npm ci
