name: CI

on:
  push:
    # ci only run in main branch direct push.
    branches: [main]
  pull_request:
    # required ci to passed in PR; branch development and main.
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_UI: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Decide whether the change can affect the gate at all. A pull request
  # that only touches prose — `README.md`, `.wiki/`, `AGENTS.md` — cannot
  # fail a check that reads source, so the three heavy jobs skip it.
  #
  # This runs on every event and never skips. The branch ruleset requires
  # one status context, `CI`, so a workflow-level `paths:` filter would be
  # the wrong tool: the workflow would not start, `CI` would never post,
  # and the required check would sit pending until the pull request is
  # abandoned. The skip has to happen inside a workflow that always runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # `paths-filter` needs the diff behind a pull request, which a
      # shallow clone does not carry. Everything else stays at depth 1.
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      # `docs` is an allow-list of what cannot affect the gate. Anything
      # this list has never heard of counts as code, so an unrecognised
      # file runs the gate rather than quietly skipping it — the list is
      # deliberately the smaller, safer half of the problem.
      #
      # `.mdx` is *not* listed: `apps/web/app/(legal)/*` import the files
      # in `apps/web/mdx/` directly, so a broken `.mdx` breaks the build.
      # Only `.md` is inert — nothing compiles it, and the only check that
      # reads it is `prettier --check`, which a prose-only change can still
      # fail on its own.
      #
      # The predicate is `some` (the default), which sets the output when
      # *any* file matches. That is not the question here, so the step
      # below compares the matched count against the total instead.
      - name: List changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: "json"
          filters: |
            docs:
              - "**/*.md"
              - ".wiki/**"
              - ".github/PULL_REQUEST_TEMPLATE.md"

      - name: Decide whether the gate can be skipped
        id: decide
        env:
          DOCS: ${{ steps.filter.outputs.docs }}
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
          # `paths-filter` reports only the files it matched, so the total
          # comes from git. On a pull request the base is the merge target,
          # which is what the ruleset evaluates.
          BASE: ${{ github.base_ref }}
        run: |
          # A skipped step defaults to running the gate. Every path that
          # is not certain the change is prose must reach `code=true`:
          # a missed check is invisible, a redundant one is not.
          code=true
          reason=""

          if [ "${DOCS}" != "true" ]; then
            reason="no file matched the prose allow-list"
          elif ! total=$(git diff --name-only "origin/${BASE}...HEAD" | wc -l); then
            reason="could not compute the changed-file count"
          elif ! docs=$(printf '%s' "${DOCS_FILES}" | jq 'length' 2>/dev/null); then
            reason="could not read the matched-file list"
          elif [ "${total}" -gt 0 ] && [ "${total}" -eq "${docs}" ]; then
            code=false
            reason="all ${total} changed file(s) are prose"
          else
            reason="${total} total, ${docs} prose, the rest is source"
          fi

          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = "true" ]; then
            echo "::notice::Running the gate: ${reason}"
          else
            echo "::notice::Skipping the gate: ${reason}"
          fi

  # The gate. Every check runs on its own runner: a red job names the
  # failing check, one check never hides another, and re-running only the
  # failures (`gh run rerun --failed`) does not repeat the ones that passed.
  #
  # The checks are shaped so they overlap as little as possible. `format`
  # and `deps` are single processes over the tree; `lint` and `typecheck`
  # are turbo tasks, so an untouched package comes from the remote cache
  # instead of running eslint or tsc again.
  quality:
    name: Quality / ${{ matrix.check }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: format
            script: "format:check"
          - check: lint
            script: "lint"
          - check: deps
            script: "check:deps"
          - check: typecheck
            script: "typecheck"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/common-actions/install

      - name: Run pnpm ${{ matrix.script }}
        run: pnpm ${{ matrix.script }}

  # The test projects alias workspace packages to their `src/` entries
  # (`workspaceAliases` in `vitest.config.mts`), so the suite reads source,
  # not `dist/`, and does not need the build. Verified by running it with
  # three packages' `dist/` removed: 161 files, all green. That is why it
  # runs here, in parallel with the build, instead of behind it on a runner
  # that would first have to download a multi-gigabyte artifact of output.
  test:
    name: Test / packages
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/common-actions/install

      # More workers do not help: the suite is bound by per-file import and
      # transform cost, and `pool: "vmThreads"` already amortises the jsdom
      # environment per worker. Sharding across runners would trade a few
      # seconds for a much larger configuration.
      - name: Test with coverage
        run: pnpm test --reporter=dot

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  # The build compiles every tsdown package and both Next.js apps. It is
  # the slowest single step and nothing else in this workflow consumes its
  # output, so a cache hit is a complete answer: the three jobs run
  # concurrently and the run's wall clock is the slowest of them, not
  # their sum.
  build:
    name: Build / packages
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/common-actions/install

      # A hit here is the difference between a full build and replaying
      # every package whose inputs the PR did not touch.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-

      - name: Build packages
        run: pnpm build

  # The branch ruleset requires exactly one status context, `CI`, and it
  # cannot express "all six jobs". This job is that single context: it does
  # no work, and it fails when any job above it fails. Renaming the jobs
  # above (`Quality / …`, `Test / …`, `Build / …`) is how the failing check
  # gets a useful name in the PR; this job is how the gate stays mergeable.
  #
  # `if: always()` is deliberate. Without it a skipped dependency would
  # skip this job too, and the required check would sit pending forever
  # instead of going red — the same silent-block failure this job exists
  # to prevent.
  ci:
    name: CI
    if: always()
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the gate
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "quality: ${QUALITY}"
          echo "test:    ${TEST}"
          echo "build:   ${BUILD}"
          # A job skipped on purpose reports `skipped`, which counts as a
          # pass. The prose-only path is the only thing that produces it:
          # the three jobs share one `if`, and a failed `changes` job fails
          # this one through its own result rather than reaching there.
          # `cancelled` is deliberately not accepted.
          for result in "${QUALITY}" "${TEST}" "${BUILD}"; do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::The gate is not green. See the job that failed above."
              exit 1
            fi
          done
          echo "The gate is green."
