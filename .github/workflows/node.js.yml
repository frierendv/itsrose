name: Node.js CI

on:
    push:
        branches: ["main", "development"]
        paths:
            - "apps/**/*.ts"
            - "packages/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "turbo.json"
            - "tsconfig*.json"
            - ".github/workflows/**"
    pull_request:
        branches: ["main", "development"]
        paths:
            - "apps/**/*.ts"
            - "packages/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "turbo.json"
            - "tsconfig*.json"
            - ".github/workflows/**"

jobs:
    qa:
        name: QA
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v6

            - name: Install
              uses: ./.github/common-actions/install

            - name: Build packages
              run: pnpm build

            - name: Run linter
              run: pnpm lint

            - name: Run typecheck
              run: pnpm typecheck

    coverage:
        name: "Jest coverage"
        runs-on: ubuntu-latest
        needs: [qa]
        steps:
            - name: Checkout branch
              uses: actions/checkout@v6

            - name: Install
              uses: ./.github/common-actions/install

            - name: Run jest coverage
              run: pnpm test --verbose=false --runInBand=false --coverage --ci --testLocationInResults
