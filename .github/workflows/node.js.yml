name: Node.js CI

on:
    push:
        branches: ["main", "development"]
        paths:
            - "apps/**/*.ts"
            - "packages/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "turbo.json"
            - "tsconfig*.json"
            - ".github/workflows/**"
    pull_request:
        branches: ["main"]
        paths:
            - "apps/**/*.ts"
            - "packages/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "turbo.json"
            - "tsconfig*.json"
            - ".github/workflows/**"

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run Type Check
              run: npm run typecheck

            - name: Run Linter
              run: npm run lint

            - name: Build packages
              run: npm run build

            - name: Run unit tests with coverage
              run: npm test -- --coverage
