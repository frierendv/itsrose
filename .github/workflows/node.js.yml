name: Node.js CI

on:
    push:
        branches: ["main", "development"]
        paths:
            - "apps/**/*.ts"
            - "packages/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "turbo.json"
            - "tsconfig*.json"
            - ".github/workflows/**"
    pull_request:
        branches: ["main"]
        paths:
            - "apps/**/*.ts"
            - "packages/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "turbo.json"
            - "tsconfig*.json"
            - ".github/workflows/**"

jobs:
    build:
        name: Build
        runs-on: self-hosted
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/common-actions/install

            - name: Build packages
              run: npm run build

    eslint:
        name: "ESLint"
        runs-on: self-hosted
        needs: [build]
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/common-actions/install

            - name: Run linter
              run: npm run lint

    types:
        name: "Typescript"
        runs-on: self-hosted
        needs: [build, eslint]
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/common-actions/install

            - name: Run typecheck
              run: npm run typecheck

    coverage:
        name: "Jest coverage"
        runs-on: self-hosted
        needs: [build, eslint, types]
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/common-actions/install

            - name: Run jest coverage
              run: npm run test -- --verbose=false --runInBand=false --coverage --ci --testLocationInResults
