name: Node.js CI

on:
    push:
        branches: ["main", "development"]
        paths: &trigger_paths
            - "apps/**/*.ts"
            - "packages/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "turbo.json"
            - "tsconfig*.json"
            - ".github/workflows/**"
    pull_request:
        branches: ["main", "development"]
        paths: *trigger_paths

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: self-hosted
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/common-actions/install

            - name: Build packages
              run: npm run build

    eslint:
        name: "ESLint"
        runs-on: self-hosted
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/common-actions/install

            - name: Run linter
              run: npm run lint

    types:
        name: "Typescript"
        runs-on: self-hosted
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/common-actions/install

            - name: Run typecheck
              run: npm run typecheck

    coverage:
        permissions:
            contents: read
            pull-requests: write
        name: "Jest coverage"
        runs-on: self-hosted
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/common-actions/install

            - name: Run jest coverage
              if: github.event_name == 'push'
              run: npm run test -- --verbose=false --runInBand=false --coverage --ci --testLocationInResults

            - name: Run jest coverage
              if: github.event_name == 'pull_request'
              uses: ArtiomTr/jest-coverage-report-action@v2
              with:
                  skip-step: install
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  test-script: npm run test -- --verbose=false --runInBand=false
                  output: report-markdown
